# Конфигурация инструментов разработки для SimpleMeasure.
# Сборка проекта остаётся на requirements.txt + PyInstaller; здесь только
# настройки линтеров/форматтеров/типизации (секции [tool.*]).

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
extend-exclude = '''
/(
    \.venv
  | build
  | dist
  | design_ui
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["api", "config", "models", "parsers", "ui", "logs"]
skip = [".venv", "build", "dist", "design_ui"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "design_ui"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # использовать pathlib вместо os.path
]
ignore = [
    "E501",  # длину строки контролирует black
    "B008",  # вызовы в значениях по умолчанию (часто в Qt)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"__init__.py" = ["F401"]  # реэкспорт в пакетах

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Кодовая база типизирована частично — не включаем strict целиком.
ignore_missing_imports = true
exclude = "(design_ui|build|dist|tests)/"

[[tool.mypy.overrides]]
module = ["PyQt6.*", "pandas.*", "openpyxl.*", "xlrd.*", "keyring.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Дублирует pytest.ini для инструментов, читающих pyproject; основной конфиг —
# в pytest.ini (он имеет приоритет, если присутствует).
qt_api = "pyqt6"
