[pytest]
# Pytest configuration for SimpleMeasure

# Минимальная версия pytest
minversion = 8.0

# Директории для поиска тестов
testpaths = tests

# Паттерн для поиска тестовых файлов
python_files = test_*.py *_test.py

# Паттерн для поиска тестовых классов
python_classes = Test*

# Паттерн для поиска тестовых функций
python_functions = test_*

# Маркеры для категоризации тестов
markers =
    unit: Unit tests (быстрые, изолированные)
    integration: Integration tests (взаимодействие компонентов)
    ui: UI tests (требуют Qt)
    slow: Slow tests (долгие тесты)
    api: API tests (тесты REST API)
    parser: Parser tests (тесты парсеров)

# Опции по умолчанию
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Настройки покрытия кода
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*
    */build/*
    */dist/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
